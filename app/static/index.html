<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proximity</title>
  <link rel="stylesheet" href="prox.css">
  <!-- ProseMirror — bundle local (pas de CDN requis) -->
  <script src="vendor/prosemirror-bundle.js"></script>
</head>
<body>

<div id="splash">
  <h1>Proximity</h1>
  <p>Analyse de votre texte en cours…</p>
</div>

<div id="fake-cursor"></div>
<div id="app" style="display:none">
  <div id="pages">
    <div class="page-wrap" id="wrap-pg">
      <div id="editor-pg"></div>
    </div>
    <div class="page-wrap" id="wrap-pd">
      <div id="editor-pd"></div>
    </div>
  </div>

  <div id="footer">
    <div id="pageline"><div id="pageline-cursor"></div></div>
    <div id="footer-info" style="font-size:12px;color:#555"></div>
    <div id="footer-nav">
      <button class="nav-btn" id="btn-prev" disabled>◀</button>
      <span id="footer-stats">—</span>
      <button class="nav-btn" id="btn-next" disabled>▶</button>
    </div>
  </div>
</div>

<script src="prox.js"></script>
</body>
</html>
